name: Build Fork Web Image

on:
  push:
    branches:
      - main
      - ui/**

permissions:
  packages: write
  contents: read

concurrency:
  group: fork-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR (default token, own namespace only)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server worker is part of the web image runtime (worker runs inside web in compose? no:
      # upstream compose runs workers within the web image via two processes). Single-arch amd64:
      # our VPS is x86_64, so skip the arm64 matrix entirely.
      - name: Build and push web (+workers) image
        uses: docker/bake-action@3acf805d94d93a86cce4ca44798a76464a75b88c # v6.9.0
        env:
          ARCH: amd64
          RELEASE: ""
          SERVER_VERSION: fork-${{ github.sha }}
        with:
          source: .
          files: docker/docker-bake.hcl
          push: true
          set: |
            web-fork.cache-from=type=registry,ref=ghcr.io/notritikpatni/karakeep-build-cache:web-fork-cache-amd64
            web-fork.cache-to=type=registry,mode=max,ref=ghcr.io/notritikpatni/karakeep-build-cache:web-fork-cache-amd64